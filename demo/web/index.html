<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAPHIR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header>
    <div class="word">saphir</div>
    <div class="hright"><span id="rolebadge"></span><span id="micdot" class="mdot"></span><span id="miclabel">mic off</span></div>
  </header>

  <div id="modebanner" class="mode">ENGLISH</div>
  <canvas id="wave" width="880" height="64"></canvas>
  <div id="sessline"></div>

  <div id="feeds">
    <div class="col">
      <div class="who"><span id="dotC" class="sdot"></span>caller</div>
      <div id="feedC" class="feed"></div>
    </div>
    <div class="col">
      <div class="who"><span id="dotR" class="sdot"></span>receptionist</div>
      <div id="feedR" class="feed"></div>
    </div>
  </div>

  <div id="banner" hidden></div>

  <div id="controls" hidden>
    <button id="btnStart">start</button>
    <button id="btnReplay" disabled>replay overheard tones</button>
    <button id="btnForge" disabled>forge a task</button>
    <button id="btnReset">reset</button>
    <span id="chanline">idle</span>
  </div>

  <ul id="audit"></ul>
  <div id="meta">frames <b id="mFrames">0</b> · wire <b id="mBytes">0</b>B · blocked <b id="mBlocked">0</b></div>

  <div id="picker" hidden>
    <div class="pickbox">
      <button onclick="pick('caller')">caller — this device calls out</button>
      <button onclick="pick('receptionist')">receptionist — this device listens</button>
      <button onclick="pick('both')">both — one device, loopback</button>
      <p>two devices is the real thing. allow the mic. localhost or https required.</p>
    </div>
  </div>

  <footer>real ggwave tx/rx · real ecdh + aes-gcm · json demo framing (wire: cbor)</footer>
</div>

<script src="vendor/ggwave.js"></script>
<script src="link.js"></script>
<script src="crypto.js"></script>
<script src="session.js"></script>
<script src="app.js"></script>
</body>
</html>
